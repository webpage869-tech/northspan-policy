# /etc/nginx/sites-available/policy.northspanltd.com
# Enable:  sudo ln -s /etc/nginx/sites-available/policy.northspanltd.com /etc/nginx/sites-enabled/
# Test:    sudo nginx -t && sudo systemctl reload nginx
# HTTPS:   sudo certbot --nginx -d policy.northspanltd.com   (adds the 443 block and redirect)

server {
    listen 80;
    listen [::]:80;
    server_name policy.northspanltd.com;

    # Uploads are capped at 2 MB by the app; leave a little headroom.
    client_max_body_size 3m;

    location / {
        proxy_pass http://127.0.0.1:5081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
