name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore tests/NorthspanPolicy.Tests/NorthspanPolicy.Tests.csproj
      - name: Build
        run: dotnet build tests/NorthspanPolicy.Tests/NorthspanPolicy.Tests.csproj -c Release --no-restore
      - name: Test
        run: dotnet test tests/NorthspanPolicy.Tests/NorthspanPolicy.Tests.csproj -c Release --no-build --verbosity normal

  deploy:
    # Deploys only after tests pass on main, and only once the repo variable DEPLOY_ENABLED is set to "true".
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          # The secret may be the key itself, or the key as one base64 line (easier to copy without breaking it).
          if printf '%s' "$SSH_KEY" | grep -q "BEGIN"; then
            printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | sed '/^$/d' > ~/.ssh/id_deploy
          else
            printf '%s' "$SSH_KEY" | tr -d '\r\n ' | base64 -d > ~/.ssh/id_deploy
          fi
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null && echo "Deploy key format OK" || { echo "DEPLOY_SSH_KEY is not a valid private key. Re-paste it, including the BEGIN and END lines."; exit 1; }
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      # Build the image here so the small shared server never runs a .NET build.
      - name: Build image
        run: docker build -t northspan-policy:latest .
      - name: Load image on server
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          docker save northspan-policy:latest | gzip | ssh -i ~/.ssh/id_deploy "$USER@$HOST" "gunzip | docker load"
      - name: Copy config and start
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          tar czf - docker-compose.yml .env.example deploy | ssh -i ~/.ssh/id_deploy "$USER@$HOST" \
            "mkdir -p /opt/northspan-policy && tar xzf - -C /opt/northspan-policy && chmod +x /opt/northspan-policy/deploy/deploy.sh && /opt/northspan-policy/deploy/deploy.sh"
      - name: Check public site
        run: curl -fsS --retry 5 --retry-delay 5 https://policy.northspanltd.com/health
